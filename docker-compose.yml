version: '3.8'

services:
  governor:
    image: python:3.11-slim
    command: python -m http.server 8080 # Placeholder
    networks:
      - agent_net
      - backend_net

  gateway:
    image: python:3.11-slim
    command: python -m http.server 8080 # Placeholder
    networks:
      - backend_net

  executor-image:
    build:
      context: ./executor
    image: png5-executor
    command: ["echo", "Executor image built"]

  docker-proxy:
    image: tecnativa/docker-socket-proxy
    environment:
      - CONTAINERS=1
      - IMAGES=1
      - VOLUMES=1
      - POST=1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - backend_net

  mock-web:
    build:
      context: ./mock-web
    networks:
      - backend_net

networks:
  agent_net:
    internal: true
  backend_net:
    internal: true
  ui_net:
